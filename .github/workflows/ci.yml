name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 시험을 서버 4대에 나눠 동시에 돈다(tests/run-all.sh 의 HARNESS_TEST_SHARD). 한 대면 약 6분 반이었다 —
    # 서버 한 대는 코어가 적어 병렬이 2개 남짓이라 줄 서서 기다렸다(2026-09-27 실측). 공개 저장소라 무료.
    # fail-fast: false — 한 대가 떨어져도 나머지 결과를 끝까지 본다.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # jq / python3 / bash 는 ubuntu-latest 기본 제공.
      # fzf 등 외부 의존·대화형 테스트는 SKIP_INTERACTIVE=1 로 건너뛴다
      # (windows-smoke.sh 는 비-WSL 환경에서 자체 SKIP).
      # 열쇠·운반 테스트(hermes-keys-test · hermes-sync-test)의 전제. ubuntu-latest 저장소의 age 패키지(age · age-keygen).
      - name: Install age
        run: sudo apt-get update -qq && sudo apt-get install -y -qq age && age --version
      - name: Run all tests
        env:
          SKIP_INTERACTIVE: "1"
          HARNESS_TEST_SHARD: "${{ matrix.shard }}/4"
        run: bash tests/run-all.sh
