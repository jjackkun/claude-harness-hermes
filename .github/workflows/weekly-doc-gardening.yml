# Weekly Doc Gardening — PDF 12쪽 "정기적으로 편차를 검사"
# harness-template-sha: ad96fb44312c1c31f87b10700a97d149ba5f71c950802a146244e082ee155725
# ↑ 설치기가 배치 시점에 본문 해시로 치환한다. 이 줄을 지우면 재설치 때
#   "사용자 수정본" 으로 취급되어 갱신이 멈춘다 (lib/harness_installers.sh).
#
# 매주 한 번, 코드와 docs/ 를 동기화 검증한다. 사람이 놓친 것을 잡는다.
# 검사 내용(예시):
#   - CLAUDE.md 가 가리키는 파일이 실제로 존재하는가 (dead link)
#   - docs/exec-plans/active/ 에 완료 상태로 남은 플랜이 있는가
#   - docs/exec-plans/completed/ 에 회고(§8) 없이 들어간 플랜이 있는가
#   - ARCHITECTURE.md 에 언급된 디렉터리가 실제로 있는가
#   - core-beliefs.md 의 R 룰이 코드/테스트에 대응하는 강제 장치를 가지고 있는가
#
# 세션 시작 훅(claude-sessionstart-doc-gardening.sh)은 exec-plans 편차만 본다. 이 워크플로는 그 위에
# CLAUDE.md dead-link · R 룰 미강제 · 룰 승격 후보 셋을 더 본다 — 둘은 겹치지 않는다(2026-09-21).
# 결과: Issue 를 하나 생성하거나, 아무 문제 없으면 조용히 종료.

name: weekly-doc-gardening

on:
  schedule:
    - cron: "0 18 * * 0"  # UTC 일요일 18:00 = KST 월요일 03:00
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  garden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect drift
        id: drift
        run: |
          set -euo pipefail
          report="/tmp/drift-report.md"
          : > "$report"

          # (1) CLAUDE.md dead links (상대 경로 .md 파일만 체크)
          if [[ -f CLAUDE.md ]]; then
            while IFS= read -r link; do
              [[ -z "$link" ]] && continue
              if [[ ! -e "$link" ]]; then
                echo "- [dead-link] \`CLAUDE.md\` → \`$link\` (존재하지 않음)" >> "$report"
              fi
            done < <(grep -oE '\]\([^)]+\.md[^)]*\)' CLAUDE.md | sed -E 's/^\]\(//; s/\).*$//; s/#.*$//')
          fi

          # (2) exec-plans 편차 감지 — 판정은 공용 스크립트가 한다.
          #     GitLab 판과 로직을 공유한다. 인라인 복제로 되돌리지 말 것 —
          #     이전 버전이 복제돼 있었고, 템플릿에 없는 status: 필드를 찾아
          #     한 번도 발동하지 않았다.
          if [[ -f scripts/hooks/doc-gardening-drift.sh ]]; then
            bash scripts/hooks/doc-gardening-drift.sh "$report"
          else
            echo "- [plan-check-skipped] \`scripts/hooks/doc-gardening-drift.sh\` 없음 — 커밋이 필요합니다" >> "$report"
          fi

          # (3) core-beliefs R 룰 ↔ 강제 장치
          if [[ -f docs/design-docs/core-beliefs.md ]]; then
            # 앵커(^R)를 두면 `## R5 …` 를 매치 못 해 grep 이 1 을 돌려주고 set -e 가 단계를 죽인다
            # (08-30~09-20 네 번 연속 실패, 3·4단계 미실행). 매치 실패는 건너뛰기여야 한다.
            while IFS= read -r rule; do
              rid=$(echo "$rule" | grep -oE 'R[0-9]+' | head -1) || true
              [[ -z "$rid" ]] && continue
              if ! grep -rq "$rid" --include='*.py' --include='*.ts' --include='*.js' --include='*.sh' . 2>/dev/null; then
                echo "- [rule-unenforced] \`$rid\` 에 대응하는 테스트/린터 강제가 발견되지 않음" >> "$report"
              fi
            done < <(grep -E '^##\s*R[0-9]+' docs/design-docs/core-beliefs.md)
          fi

          # (4) 룰 승격 후보 감지 (PDF 10쪽 피드백 루프)
          #     최근 30일 커밋 메시지에서 fix/bug/revert 키워드를 카운트.
          #     같은 파일에 3회 이상 수정이 쏠리면 승격 후보로 플래그.
          if [[ -d .git ]]; then
            since=$(date -u -d '30 days ago' +%Y-%m-%d 2>/dev/null || date -u -v-30d +%Y-%m-%d)
            git log --since="$since" --name-only --pretty=format: \
              --grep='^\(fix\|bug\|revert\)' 2>/dev/null \
              | grep -v '^$' | sort | uniq -c | sort -rn \
              | awk '$1 >= 3 { print $2 " (" $1 "회 수정)" }' > /tmp/hot-files.txt || true
            if [[ -s /tmp/hot-files.txt ]]; then
              echo "" >> "$report"
              echo "### 🔥 룰 승격 후보 (반복 수정 파일)" >> "$report"
              echo "" >> "$report"
              while IFS= read -r line; do
                echo "- [rule-candidate] \`$line\` — \`harness-promote-rule\` 스킬 invoke 고려" >> "$report"
              done < /tmp/hot-files.txt
            fi
          fi

          ### EDIT ME — 프로젝트별 편차 검사 추가

          if [[ -s "$report" ]]; then
            echo "has_drift=true" >> "$GITHUB_OUTPUT"
            {
              echo 'body<<EOF'
              echo "# Doc Gardening Report — $(date -u +%Y-%m-%d)"
              echo
              echo "다음 편차가 감지됐다. **차단 명령이 아니라 판단 가이드**다."
              echo "각 항목은 *살펴봐야 할 대상* 이며, 고칠지 말지는 도메인 맥락을"
              echo "아는 사람/에이전트가 결정한다."
              echo
              cat "$report"
              echo EOF
            } >> "$GITHUB_OUTPUT"
          else
            echo "has_drift=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open issue if drift
        if: steps.drift.outputs.has_drift == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const body = `${{ steps.drift.outputs.body }}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[doc-gardening] 편차 감지 — ${new Date().toISOString().slice(0,10)}`,
              body,
              labels: ['harness', 'doc-gardening']
            });

      # 앞 단계가 실패하면 알린다. schedule 워크플로는 보는 사람이 없어 08-30~09-20 네 번 연속
      # 실패를 4주 동안 아무도 몰랐다. 제목을 고정해 열린 이슈가 있으면 댓글만 단다(매주 쌓이지 않게).
      # 알림 자체가 실패해도 새 실패를 만들지 않는다 — 알림이 게이트가 되면 안 된다.
      # 시험: tests/workflow-failure-notice-test.sh (이 script 를 node 로 실제로 돌린다)
      - name: Report workflow failure
        if: failure()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const title = '[doc-gardening] 워크플로 실패';
            const { owner, repo } = context.repo;
            const run = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = `워크플로 \`${context.workflow}\` 가 실패했다 — ${run}\n\n` +
              '검사가 죽으면 검사가 없는 것과 같다. 실행 로그에서 실패한 단계를 확인하라.';
            try {
              const { data: open } = await github.rest.issues.listForRepo({
                owner, repo, state: 'open', labels: 'harness', per_page: 100,
              });
              const found = open.find((i) => i.title === title);
              if (found) {
                await github.rest.issues.createComment({ owner, repo, issue_number: found.number, body });
              } else {
                await github.rest.issues.create({ owner, repo, title, body, labels: ['harness'] });
              }
            } catch (e) {
              core.warning(`실패 알림을 남기지 못했다: ${e.message}`);
            }
