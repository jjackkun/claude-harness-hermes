read -r -d '' _serena_section <<'EOF' || true
## Serena MCP — 심볼 의미 분석 전용 (필요할 때만)

이 프로젝트는 Serena MCP 가 등록되어 있다. 상시 탐색 도구가 아니라,
**Grep 으로는 정확도가 보장되지 않는 상황에서만** 꺼내 쓰는 정밀 도구다.

### 기본 탐색은 Grep / Read / Explore
파일·문자열 검색, 마크다운·설정 파일은 Grep/Read 가 더 빠르고 정확하다.
탐색 범위가 넓으면 Explore 서브에이전트로 컨텍스트를 격리한다.

### Serena 를 쓰는 경우 — LSP 의미 분석이 필요할 때
Grep 은 텍스트만 보므로 아래 상황에서 **미탐(누락)** 이 난다. 이때만 Serena 를 쓴다.
- 심볼 삭제·시그니처 변경 전 영향 범위 확인 → `find_referencing_symbols`
- 배럴 재수출(`index.ts` / `__init__.py`)로 별칭된 심볼의 실제 호출부 추적
- 인터페이스·추상 클래스의 구현체 전수 조사 → `find_implementations`
- 프로젝트 전역 안전 리네임 → `rename_symbol`

### 사용 절차 — 위 상황에 진입했을 때만
1. `ToolSearch("select:mcp__plugin_serena_serena__find_symbol")` 등 필요한 도구만 스키마 로드
2. 활성 프로젝트 미설정이면 `activate_project`
3. 작업이 끝나면 Grep/Read 로 복귀

### 금지
- 코드가 아닌 파일(마크다운·JSON·YAML·셸)에 Serena 를 쓰지 말 것 — LSP 가 파싱하지 않는다.
- 같은 검색을 Grep + Serena 둘 다 돌리지 말 것.
- 세션 시작 시 선제적으로 초기화하지 말 것. 필요한 순간에 한다.
EOF
CLAUDE_MD_SECTIONS+=("$_serena_section")
unset _serena_section

