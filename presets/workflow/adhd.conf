#  presets/workflow/adhd.conf
# 행동 우선 답변 규칙 프리셋 — 첫 줄=할 일, 마지막=다음 행동 하나, 진행 상태 재공지, 서두·맺음말 금지.
# 스킬이 아니라 규칙으로 배포한다: 규칙은 세션 시작 시 자동 로드되어 자연어 대화에 바로 적용된다.
# 출처: ayghri/i-have-adhd (MIT) 의 10개 규칙 중 4개.
# 근거: docs/exec-plans/completed/2026-09-14-adhd-output-rule.md
#
# 예:
#   project-claude.sh ~/PROJECT/my-app harness hermes adhd

RULES+=(adhd)
