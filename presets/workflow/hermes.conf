# presets/workflow/hermes.conf
#
# 헤르메스 엔지니어링 프리셋.
# 하네스 엔지니어링 위에 자가 진화 러닝 루프를 올린다.
# 선행 조건: harness.conf 가 함께 선택되어야 한다.
#
# 활성화되는 것:
#   1. SQLite 기억 구조 초기화 (global + project)
#   2. /hermes-status 슬래시 커맨드 스킬
#   3. hermes-crystallize 스킬 (자동 스킬화 트리거)
#   4. CLAUDE.md 헤르메스 안내 섹션
#
# 사용:
#   project-claude.sh ~/PROJECT/new-app python fastapi postgres harness hermes

# ── 0. 권한 ─────────────────────────────────────────────────────────────────
# (sqlite3 CLI 의존 제거됨 — python sqlite3 모듈만 사용하므로 별도 Bash 권한 불필요)

# 헤르메스 결정화 서브세션(claude -p)은 .hermes/ 에 직접 쓰므로 워크트리 격리 불필요
WORKTREE_BG_ISOLATION+=("none")

# ── 1. 스킬 ─────────────────────────────────────────────────────────────────
SKILLS+=(
  hermes-status
  hermes-crystallize
  hermes-recall
  hermes-dream
  hermes-loop
  hermes-agent
)

# ── 1-1. Stop Hook (러닝 루프) + UserPromptSubmit 실수 감지 ─────────────────
HARNESS_HOOK_SOURCES+=(claude-stop-retrospective.sh)
HARNESS_HOOK_SOURCES+=(claude-userpromptsubmit-mistake-detect.sh)
STOP_HOOKS+=('${CLAUDE_PROJECT_DIR}/scripts/hooks/claude-stop-retrospective.sh')
# 하위 에이전트 종료를 작업 이력에 남긴다 (계획 2026-09-15-universe-id-journal 목표 7)
HARNESS_HOOK_SOURCES+=(claude-subagentstop-journal.sh)
# 세션 종료 시 미완료 작업을 이력에 남긴다 (계획 2 목표 6)
HARNESS_HOOK_SOURCES+=(claude-stop-journal-gap.sh)
STOP_HOOKS+=('${CLAUDE_PROJECT_DIR}/scripts/hooks/claude-stop-journal-gap.sh')
SUBAGENT_STOP_HOOKS+=('${CLAUDE_PROJECT_DIR}/scripts/hooks/claude-subagentstop-journal.sh')
# 세션 안 Bash 에서 열쇠 생성·입력을 막는다 (T-11, 계획 3 목표 5). 열쇠는 사람이 세션 밖에서.
HARNESS_HOOK_SOURCES+=(claude-pretooluse-key-guard.sh)
PRE_TOOL_USE_HOOKS+=('Bash::${CLAUDE_PROJECT_DIR}/scripts/hooks/claude-pretooluse-key-guard.sh')
# 세션 안 claude -p 직접 호출 차단 — 러너가 남긴 소환 토큰 파일이 있을 때만 통과 (계획 4 목표 7)
HARNESS_HOOK_SOURCES+=(claude-pretooluse-summon-guard.sh)
PRE_TOOL_USE_HOOKS+=('Bash::${CLAUDE_PROJECT_DIR}/scripts/hooks/claude-pretooluse-summon-guard.sh')
# 개별 등록하지 않는다 — 디스패처가 이름순으로 부른다(stdin 경쟁 방지).
# harness.conf 와 중복 등록돼도 generate_settings_json 이 중복을 제거한다.
HARNESS_HOOK_SOURCES+=(claude-userpromptsubmit-dispatch.sh)
USER_PROMPT_SUBMIT_HOOKS+=('${CLAUDE_PROJECT_DIR}/scripts/hooks/claude-userpromptsubmit-dispatch.sh')

# ── 1-2. SessionStart Hook (드리밍 자동 트리거, cron 대체) ──────────────────
# startup/resume 세션 시작 시 하루 1회(throttle) 드리밍을 백그라운드로 구동.
# 끄기: HERMES_DREAM_ON_SESSION_START=0 / 간격: HERMES_DREAM_THROTTLE_HOURS(기본 20)
HARNESS_HOOK_SOURCES+=(claude-sessionstart-dream.sh)
SESSION_START_HOOKS+=('${CLAUDE_PROJECT_DIR}/scripts/hooks/claude-sessionstart-dream.sh')
HARNESS_HOOK_SOURCES+=(claude-sessionstart-memory-guard.sh)
SESSION_START_HOOKS+=('${CLAUDE_PROJECT_DIR}/scripts/hooks/claude-sessionstart-memory-guard.sh')
# 원격 기억을 받아 복호한다 — 재색인 훅보다 앞에 등록해 같은 시작에서 새 조각이 색인되게 한다
# (계획 3 목표 8·14). sync.json 없는 소우주·age 없는 컴퓨터는 한 줄 남기고 건너뛴다.
# 소환 토큰 검증 — 소환된 세션(HERMES_SUMMON_NONCE)만 동작. 실패해도 세션은 멈추지 않는다 (계획 4 목표 6)
HARNESS_HOOK_SOURCES+=(claude-sessionstart-summons-verify.sh)
SESSION_START_HOOKS+=('${CLAUDE_PROJECT_DIR}/scripts/hooks/claude-sessionstart-summons-verify.sh')
HARNESS_HOOK_SOURCES+=(claude-sessionstart-sync-pull.sh)
SESSION_START_HOOKS+=('${CLAUDE_PROJECT_DIR}/scripts/hooks/claude-sessionstart-sync-pull.sh')
HARNESS_HOOK_SOURCES+=(claude-sessionstart-history-reindex.sh)
SESSION_START_HOOKS+=('${CLAUDE_PROJECT_DIR}/scripts/hooks/claude-sessionstart-history-reindex.sh')
# 생애주기 린트(3~6개월 주기) — 자동은 --propose(dry-run) 제안 리포트까지만.
# 끄기: HERMES_LIFECYCLE_ON_SESSION_START=0 / 간격: HERMES_LIFECYCLE_THROTTLE_HOURS(기본 2160=90일)
HARNESS_HOOK_SOURCES+=(claude-sessionstart-lifecycle-lint.sh)
SESSION_START_HOOKS+=('${CLAUDE_PROJECT_DIR}/scripts/hooks/claude-sessionstart-lifecycle-lint.sh')
# 인계 봉투 만료 — 기한 지난 미시작 봉투에 handoff.expired 를 붙인다(계획 4 목표 11).
# 시간 데몬이 아니라 세션 시작 훅이 돌린다. 구 스키마·journal 없는 소우주는 조용히 건너뛴다.
HARNESS_HOOK_SOURCES+=(claude-sessionstart-handoff-expiry.sh)
SESSION_START_HOOKS+=('${CLAUDE_PROJECT_DIR}/scripts/hooks/claude-sessionstart-handoff-expiry.sh')
# 제안 봉투 배달 결과 알림(계획 5 목표 10): 배달된 봉투의 이슈 상태(gh)·pending 개수를 한 줄 알린다.
HARNESS_HOOK_SOURCES+=(claude-sessionstart-outbox-status.sh)
SESSION_START_HOOKS+=('${CLAUDE_PROJECT_DIR}/scripts/hooks/claude-sessionstart-outbox-status.sh')

# ── 1-3. PostToolUse Hook (C1 — 어려움 신호 기반 스킬 주입) ─────────────────
# Bash 도구가 터미널 실패(401/permission denied/Traceback/FAILED 등)를 내면
# 관련 결정화 스킬을 그 자리에서 에이전트 컨텍스트에 주입한다.
# 상한: 이벤트당 1개 / 세션당 3개(HERMES_ASSIST_MAX_PER_SESSION).
# 근거: docs/superpowers/specs/2026-07-09-hermes-injection-trigger-design.md
HARNESS_HOOK_SOURCES+=(claude-posttooluse-hermes-assist.sh)
POST_TOOL_USE_HOOKS+=('Bash::${CLAUDE_PROJECT_DIR}/scripts/hooks/claude-posttooluse-hermes-assist.sh')

# ── 2. DB 초기화 + 스킬 인덱싱 + 스크립트 복사 ────────────────────────────
_hermes_setup() {
  local project_path="$1"
  local scripts_dir
  scripts_dir="$(cd "$(dirname "${BASH_SOURCE[0]}")/../.." && pwd)/scripts"

  if [[ ! -f "$scripts_dir/hermes-init.py" ]]; then
    log_warn "hermes-init.py not found — DB 초기화 건너뜀"
    return 0
  fi

  # hermes python 스크립트를 프로젝트 scripts/ 로 복사
  # (훅 파일이 복사된 뒤 PROJECT/scripts/ 를 기준으로 찾기 때문에 필수)
  local target_scripts="$project_path/scripts"
  mkdir -p "$target_scripts"
  local hermes_scripts=(
    hermes-init.py
    hermes-save-session.py
    hermes_save_session_storage.py
    hermes_save_session_signals.py
    hermes_save_session_patterns.py
    hermes-crystallize.py
    hermes-increment.py
    hermes-search.py
    hermes_search_fallback.py
    hermes-evolve-skill.py
    hermes_dream_evolve.py
    hermes-index-skills.py
    hermes_skills.py
    hermes_skill_layers.py
    hermes_skill_render.py
    hermes_skill_extends.py
    hermes-skill.py
    hermes_redact.py
    hermes_uuid7.py
    hermes_universe.py
    hermes_journal_schema.py
    hermes_journal.py
    hermes_journal_views.py
    hermes-journal.py
    hermes_secret_values.py
    hermes-correlate.py
    hermes-prune.py
    hermes-export-history.py
    hermes_history_fragments.py
    hermes_crypto.py
    hermes_keys.py
    hermes_mnemonic.py
    hermes-keys.sh
    hermes_sync_ref.py
    hermes_sync_fragments.py
    hermes-sync.py
    hermes_yaml_subset.py
    hermes_org.py
    hermes_roster.py
    hermes-agent.py
    hermes_summons.py
    hermes-summon.py
    hermes_memory_events.py
    hermes_memory_conflicts.py
    hermes_memory_view.py
    hermes_done_when.py
    hermes_handoff.py
    hermes_envelope.py
    hermes_envelope_gate.py
    hermes-propose.py
    hermes-scrub-history.py
    hermes-reindex.py
    hermes-manager.py
    hermes-message.py
    hermes-cron-run.sh
    hermes-cleanup.py
    hermes_keywords.py
    hermes-summarize.py
    hermes-recall.py
    hermes_reuse.py
    hermes-lifecycle.py
    hermes_lifecycle_apply.py
    hermes-dream.py
    hermes_loop.py
    hermes_loop_prompt.py
    hermes_loop_report.py
    hermes_loop_decisions.py
    hermes-loop.py
    hermes-loop-run.sh
  )
  # 이 저장소 자신에 설치하는 경우 원본과 대상이 같은 디렉터리다. cp 가
  # "are the same file" 로 실패하고, project-claude.sh 는 set -e 라서 설치
  # 전체가 그 자리에서 멈춘다. 복사할 필요도 없으므로 통째로 건너뛴다.
  if [[ "$scripts_dir" -ef "$target_scripts" ]]; then
    log_info "  hermes  → scripts/ 가 원본과 같은 위치라 복사 생략(자기 설치)"
  else
    local copied_count=0
    for s in "${hermes_scripts[@]}"; do
      if [[ -f "$scripts_dir/$s" ]]; then
        cp "$scripts_dir/$s" "$target_scripts/$s"
        chmod +x "$target_scripts/$s"
        copied_count=$((copied_count + 1))
      fi
    done
    log_info "  hermes  → scripts/ 에 python 스크립트 ${copied_count}개 복사"

    # BIP-39 사전 — 비상 열쇠 24단어 변환(hermes_mnemonic.py)이 scripts/data/ 에서 찾는다.
    # 계획 2026-09-15-sync-transport-encryption 목표 4.
    local wordlist="$scripts_dir/../assets/data/bip39-english.txt"
    if [[ -f "$wordlist" ]]; then
      mkdir -p "$target_scripts/data"
      cp "$wordlist" "$target_scripts/data/bip39-english.txt"
    fi
    # SOUL 틀 — hire 가 정체성 폴더를 만들 때 쓴다 (계획 4 목표 2)
    local soul_tpl="$scripts_dir/../assets/templates/agent/SOUL.md"
    if [[ -f "$soul_tpl" ]]; then
      mkdir -p "$target_scripts/templates/agent"
      cp "$soul_tpl" "$target_scripts/templates/agent/SOUL.md"
    fi

    # 업스트림에서 삭제된 구버전 스크립트 정리 (업데이트 시 고아 복사본 잔존 방지)
    # 자기 설치일 때는 대상이 곧 원본이므로 이 정리도 건너뛴다 — 그러지 않으면
    # 저장소의 원본 파일을 지운다.
    local hermes_removed=(
      hermes-build-prompt.py
      hermes_signals.py
    )
    for s in "${hermes_removed[@]}"; do
      if [[ -f "$target_scripts/$s" ]]; then
        rm -f "$target_scripts/$s"
        log_info "  hermes  → 구버전 스크립트 제거: scripts/$s"
      fi
    done
  fi

  # DB 초기화
  if ! python3 "$target_scripts/hermes-init.py" --both "$project_path" 2>/dev/null; then
    log_warn "헤르메스 DB 초기화 실패 (python3 확인 필요)"
    return 0
  fi
  log_info "  hermes  → DB 초기화 완료 ($project_path/.hermes/state.db)"

  # 공장 위치·설치 버전 기록 (설계 skill-proposal-delivery.md §5, RV-16: 설치기만 쓴다)
  # remote_url 은 제안 봉투의 배달 목적지, installed_version 은 봉투 base 의 근거.
  local factory_remote factory_head factory_root
  factory_root="$(cd "$scripts_dir/.." && pwd)"
  factory_remote="$(git -C "$factory_root" remote get-url origin 2>/dev/null || echo "")"
  factory_head="$(git -C "$factory_root" rev-parse HEAD 2>/dev/null || echo "")"
  F_REMOTE="$factory_remote" F_HEAD="$factory_head" python3 - "$project_path/.hermes/factory.json" <<'PYEOF'
import json, os, sys
json.dump({"remote_url": os.environ["F_REMOTE"], "installed_version": os.environ["F_HEAD"]},
          open(sys.argv[1], "w", encoding="utf-8"), indent=2)
PYEOF
  log_info "  hermes  → factory.json 기록 (${factory_head:0:7})"

  # 확장 기준 버전 대조 (계획 5 목표 6, RV-13): 기준 공장 커밋이 바뀐 확장에 [extends WARN].
  # 확장이 없거나 factory.json 이 없으면 조용하다.
  python3 -c "import sys; sys.path.insert(0,'$target_scripts'); from hermes_skill_extends import warn_stale; warn_stale('$project_path')" 2>&1 | sed 's/^/  hermes  → /' || true

  # 소우주 키(universe.id)와 명부의 첫 한 명(main) — 계획 2026-09-15-universe-id-journal Step 1.
  # 키는 한 번 만들면 재설치해도 바뀌지 않는다(폴더 이름을 키로 쓰던 것을 대체).
  python3 - "$project_path" "$target_scripts" <<'PYEOF'
import json, sys, pathlib
project, scripts = sys.argv[1], sys.argv[2]
sys.path.insert(0, scripts)
from hermes_universe import ensure_universe_id
from hermes_uuid7 import uuid7_str

uid = ensure_universe_id(project)
roster = pathlib.Path(project) / ".hermes/agents.json"
if not roster.exists():
    roster.write_text(json.dumps({"agents": [{
        "agent_id": uuid7_str(), "name": "main", "status": "active",
        "created_by": "system:installer",
    }]}, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
print(uid[:8])
PYEOF
  log_info "  hermes  → universe.id · agents.json(main) 확인"

  # 조직 정의 — 없으면 빈 조직(empty.yaml)을 복사한다(C-18). 있으면 건드리지 않는다.
  # unit_id 가 빈 단위가 있으면 부여해 써 넣는다(G-14). 계획 2026-09-15-agent-identity 목표 3.
  local org_tpl="$scripts_dir/../assets/templates/organization/empty.yaml"
  if [[ ! -f "$project_path/.hermes/organization.yaml" && -f "$org_tpl" ]]; then
    cp "$org_tpl" "$project_path/.hermes/organization.yaml"
    log_info "  hermes  → organization.yaml 생성(빈 조직) — 템플릿: assets/templates/organization/"
  fi
  PYTHONPATH="$target_scripts" python3 -c "
import sys
from hermes_org import ensure_unit_ids, OrgError
try:
    n = ensure_unit_ids(sys.argv[1])
    if n: print(f'  unit_id {n}개 부여')
except OrgError as e:
    print(f'[hermes] organization.yaml 오류: {e}', file=sys.stderr)
" "$project_path" 2>&1 | sed 's/^/  hermes  →/' || true

  # 스킬 인덱싱 — 네 층(universe·common·unit·agent) 전부 (계획 5 목표 1·2)
  local db_path="$project_path/.hermes/state.db"
  if [[ -f "$db_path" ]]; then
    python3 "$target_scripts/hermes-index-skills.py" \
      --db "$db_path" \
      --project "$project_path" 2>/dev/null || true
    log_info "  hermes  → 스킬 4층 인덱싱 완료"
  fi
}

# NOTE: 여기서 즉시 실행하지 않는다.
# _hermes_setup 은 project-claude.sh 의 설치 단계(dry-run 분기 이후,
# install_skills 이후)에서 호출된다 — source 시점에 실행하면 --dry-run 에서도
# 파일이 생성되고, 첫 설치 시 .claude/skills 가 없어 스킬 인덱싱이 스킵된다.

# ── 3. .gitignore 에 .hermes/ 추가 ──────────────────────────────────────────
# .hermes/* 로 내용물만 무시해야 !.hermes/skills/ 예외가 동작함.
# .hermes/ 전체를 무시하면 git이 하위를 재검사하지 않아 예외가 무효가 됨.
GITIGNORE_ENTRIES+=(".hermes/*")
GITIGNORE_ENTRIES+=("!.hermes/skills/")
GITIGNORE_ENTRIES+=("!.hermes/skills/**")
GITIGNORE_ENTRIES+=("!.hermes/factory.json")
GITIGNORE_ENTRIES+=("!.hermes/universe.id")
GITIGNORE_ENTRIES+=("!.hermes/agents.json")
# 정체성 자산은 git 을 탄다(계획 4 목표 14). .hermes/* 가 내용물을 무시하므로 디렉터리
# 단계마다 예외를 풀고, 그 뒤에 파생물(MEMORY.md)·1회용 토큰(summons/)을 재무시한다.
GITIGNORE_ENTRIES+=("!.hermes/agents/")
GITIGNORE_ENTRIES+=("!.hermes/agents/*/")
GITIGNORE_ENTRIES+=(".hermes/agents/*/*")           # 폴더 안 내용물은 도로 무시하고 아래 둘만 푼다
GITIGNORE_ENTRIES+=("!.hermes/agents/*/SOUL.md")
GITIGNORE_ENTRIES+=("!.hermes/agents/*/skills/")
GITIGNORE_ENTRIES+=("!.hermes/agents/*/skills/**")
GITIGNORE_ENTRIES+=("!.hermes/organization.yaml")
GITIGNORE_ENTRIES+=(".hermes/summons/")
# 원문은 코드 브랜치에 커밋하지 않는다 (T-02). 2026-09-16 이전까지 여기 예외 두 줄이 있어
# .hermes/history/*.jsonl 평문이 커밋됐다(zeroday 241개). 옮기는 일은 refs/hermes/sync 가
# 맡고, 조각은 age 로 잠긴다 — 계획 2026-09-15-sync-transport-encryption 목표 1.
# 이미 추적 중인 파일은 무시 규칙과 무관하므로 그대로 남는다(추적 해제는 저장소별 사람 판단).

# ── 5. 자율 에이전트 (선택) ──────────────────────────────────────────────────
# HERMES_AUTONOMOUS=1 로 설정하면 cron 설정 가이드를 출력한다.
# 자동 cron 등록은 하지 않음 — 사용자가 직접 설정해야 한다.
# 참고: docs/hermes-cron-guide.md
_hermes_autonomous_hint() {
  local project_path="$1"
  log_info "  hermes  → 자율 에이전트 힌트 (HERMES_AUTONOMOUS=1)"
  log_info "    cron 설정: docs/hermes-cron-guide.md 참고"
  log_info "    매니저 테스트:"
  log_info "      python3 $project_path/scripts/hermes-manager.py \\"
  log_info "        --db $project_path/.hermes/state.db \\"
  log_info "        --action start --projects <프로젝트명>"
}

if [[ "${HERMES_AUTONOMOUS:-0}" == "1" && -n "${PROJECT_PATH:-}" ]]; then
  _hermes_autonomous_hint "$PROJECT_PATH"
fi

# ── 4. CLAUDE.md 안내 섹션 ──────────────────────────────────────────────────
read -r -d '' _hermes_section <<'EOF' || true
## 헤르메스 엔지니어링 (Hermes Engineering)

이 프로젝트는 `hermes` 프리셋으로 자가 진화 러닝 루프가 활성화되어 있다.

**기억 구조:**
- `[project]/.hermes/state.db` — 프로젝트 전용 SQLite (세션 기억 + 스킬 인덱스)
- `~/.hermes/global.db` — 전역 SQLite (공통 패턴 + 사용자 성향)

**자동 동작 (Claude Code 세션 훅 기반 — Codex 세션에서는 미동작, 추후 버전업에서 지원 예정):**
- 세션 종료 시 러닝 루프: 저장 → 롤링 요약 → 결정화(반복 3회+) → 스킬 효용 상관·강등
- 결정화된 스킬은 `[project]/.hermes/skills/` 에 저장
- 세션 시작 시(startup/resume): 관련 스킬 자동 검색 주입 + 직전 세션 요약 회상 주입 + 하루 1회 드리밍 자동 실행(throttle 20h, 백그라운드)
- 작업 도중 Bash 가 터미널 실패(401·permission denied·Traceback·FAILED 등)를 내면 관련 스킬을 그 자리에서 주입 (세션당 최대 3회)

**슬래시 커맨드:**
- `/hermes-status` — 전체 스킬/규칙/세션 현황 확인
- `/hermes-crystallize` — 대기 패턴 즉시 결정화 (수동 실행)
- `/hermes-recall` — 직전 세션 요약 키워드 검색·회상
- `/hermes-dream` — 드리밍 결정화 수동 실행 (누적 요약 → 승격 + junk 스킬 정리 제안)

**자율 에이전트 (선택):**
- cron + `scripts/hermes-cron-run.sh` 로 매니저 에이전트 자동 실행 가능
- 설정 방법: `docs/hermes-cron-guide.md` 참고
- 테스트: `python3 scripts/hermes-manager.py --db .hermes/state.db --action start --projects <프로젝트명>`

**목표 기반 자율 루프:**
- 헤드리스: `scripts/hermes-loop-run.sh <프로젝트> "<목표>"` — 완료/안전캡까지 자율 반복
- 대화형: `/hermes-loop <목표>` — 현재 세션에서 반복 (파괴적 작업은 승인 게이트)
- 상태/중단: `python3 scripts/hermes-loop.py status` / `... stop <loop-id>`
- 재개: `scripts/hermes-loop-run.sh <프로젝트> --resume <loop-id>`
- 가이드: `docs/hermes-loop-guide.md`

**원칙:**
- 로컬 스킬 진화는 자동, 공통(claude-harness-hermes) 반영은 사용자 승인 후 PR
- AI가 공통 스킬을 자동으로 수정하는 것은 금지
- 파괴적 작업(삭제·force push)은 자율 에이전트도 절대 자동 실행하지 않는다
EOF
CLAUDE_MD_SECTIONS+=("$_hermes_section")
unset _hermes_section
