#  presets/workflow/korean.conf
# 한국어 답변 프리셋 — 사용자에게 보이는 답변을 한국어로 강제한다(선택).
# 세 겹: 규칙(세션 시작 로드) + 매 턴 한 줄 주입(디스패처 경유) + Stop 훅 검사(영어 위주면 끝내기를 막고 다시 쓰게 함).
# 기억(메모리)만으로는 긴 작업 끝 보고에서 놓쳐서 만들었다.
# 근거: docs/exec-plans/completed/2026-10-16-korean-reply-guard-plan.md
#
# 예:
#   project-claude.sh ~/PROJECT/my-app harness hermes korean
# 끄기: KOREAN_GUARD_DISABLED=1 (임시) · presets.lock 에서 korean 제거 후 재설치(영구)

RULES+=(korean)

HARNESS_HOOK_SOURCES+=(
  claude-userpromptsubmit-korean.sh
  claude-stop-korean-guard.sh
  korean_reply_check.py
)

# 매 턴 한 줄 — 개별 등록하지 않는다. 디스패처가 이름순으로 부른다(stdin 경쟁 방지).
# harness·hermes 와 중복 등록돼도 generate_settings_json 이 중복을 제거한다.
HARNESS_HOOK_SOURCES+=(claude-userpromptsubmit-dispatch.sh)
USER_PROMPT_SUBMIT_HOOKS+=('${CLAUDE_PROJECT_DIR}/scripts/hooks/claude-userpromptsubmit-dispatch.sh')

# Stop 검사는 Claude 세션만 — Codex 는 transcript 형식이 달라 판정할 수 없다.
# Codex hooks.json 생성기가 ${CLAUDE_PROJECT_DIR}/scripts/hooks/ 명령을 걸러 내므로(_is_claude_project_hook) 따로 막지 않는다.
STOP_HOOKS+=('${CLAUDE_PROJECT_DIR}/scripts/hooks/claude-stop-korean-guard.sh')

# 같은 턴을 두 번 막지 않으려고 남기는 표시·훅 로그 — hermes 가 없는 프로젝트에서도 커밋에 섞이지 않게.
GITIGNORE_ENTRIES+=(".hermes/korean-guard.last" ".hermes/hooks.log")
