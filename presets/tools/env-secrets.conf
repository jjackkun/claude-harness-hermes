# presets/tools/env-secrets.conf
# .env 전체를 암호화한 .env.secrets 로 git 에 실어 PC 사이로 옮긴다. 여는 열쇠는 Bitwarden(무료)에.
# 고른 프로젝트에만 scripts/env-secrets/ 가 깔린다 — .env 를 안 쓰는 프로젝트도 있어서 선택 프리셋이다.
#
# 출처: 하류 jj-agent-room scripts/fork/secrets.sh (2026-10-16 다른 PC 에서 바이트 동일 복원 실측).
# 계획: docs/exec-plans/active/2026-10-16-env-secrets-preset.md
#
# 필요한 것: node·npm. REQUIRED_BINS 로 선언하지 않는다 — 그 목록은 lib/tool_installers.sh 의 핀 표
# (sha256 고정 배포 파일)에 있는 도구만 받는다. dotenvx·Bitwarden CLI 는 도구가 처음 쓸 때 고정 판을 받는다.
#
# .env.keys 무시 줄은 여기서 선언하지 않는다 — 공통 목록(lib/harness_installers.sh install_harness_gitignore)에 있다.
# 프리셋을 빼고 재설치해도 열쇠 파일이 계속 무시되게 하려는 것이다.

# _env_secrets_setup <project> — assets/env-secrets/ 를 scripts/env-secrets/ 로. 공존 규칙(install_factory_file)이
# 하류가 고친 파일을 덮지 않는다. 진입점만 실행 비트, lib 는 source 되는 파일이라 644.
_env_secrets_setup() {
  local project_path="$1" src_root rel mode
  src_root="$(cd "$(dirname "${BASH_SOURCE[0]}")/../.." && pwd)/assets/env-secrets"
  [[ -f "$src_root/secrets.sh" ]] || { log_warn "assets/env-secrets 없음 — env-secrets 설치 건너뜀"; return 0; }
  mkdir -p "$project_path/scripts/env-secrets/lib"
  while IFS= read -r rel; do
    mode=644; [[ "$rel" == secrets.sh ]] && mode=755
    install_factory_file "$src_root/$rel" "$project_path/scripts/env-secrets/$rel" script \
      "scripts/env-secrets/$rel" "$project_path/.claude" "$mode"
  done < <(cd "$src_root" && find . -type f | sed 's|^\./||' | sort)
  log_info "env-secrets → scripts/env-secrets/ (bash scripts/env-secrets/secrets.sh import|open)"
}

read -r -d '' _env_secrets_section <<'EOF' || true
## .env 옮기기 — env-secrets

`.env` 는 git 에 안 올라간다. 대신 암호화한 `.env.secrets` 를 커밋하고, 여는 열쇠는 Bitwarden 에 둔다.

- 처음 한 번(값이 든 PC): `bash scripts/env-secrets/secrets.sh import` → `.env.secrets` 커밋
- 다른 PC: `bash scripts/env-secrets/secrets.sh open` — Bitwarden 마스터 비밀번호만 묻는다
- `.env` 를 바꾸면 커밋 게이트 R-env-secrets 가 같은 열쇠로 다시 암호화해 그 커밋에 넣는다(커밋을 막지 않는다)
- 열쇠 파일 `.env.keys` 는 git 밖(.gitignore). Bitwarden 계정이 없으면 https://vault.bitwarden.com 에서 무료 가입
EOF
CLAUDE_MD_SECTIONS+=("$_env_secrets_section")
unset _env_secrets_section
