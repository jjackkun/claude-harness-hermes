# presets/tools/prettier.conf
# 편집 직후 prettier --check 결과를 경고로 띄우는 hook (차단 X — 감각 학습).
#
# 2026-08-04 harness.conf 에서 분리. harness 는 언어 무관 프리셋인데 이 hook 은
# prettier 가 실제로 설치된 프로젝트에서만 의미가 있다. 산문 마크다운 저장소
# (novel-*) 처럼 prettier 가 없는 곳에서는 실행 실패가 「위반」으로 오인돼
# .md 를 저장할 때마다 오경고가 났다.
#
# 선택 기준: node_modules 에 prettier 가 설치돼 있거나 .prettierrc* 가 있는 프로젝트.
# 대상 확장자: js jsx ts tsx svelte vue json css scss md yaml yml
#              (assets/hooks/claude-posttooluse-prettier-warn.sh 참조)

HARNESS_HOOK_SOURCES+=(
  claude-posttooluse-prettier-warn.sh
)

POST_EDIT_HOOKS+=('${CLAUDE_PROJECT_DIR}/scripts/hooks/claude-posttooluse-prettier-warn.sh')

read -r -d '' _prettier_section <<'EOF' || true
## 포맷팅 — prettier

- **편집 후 prettier 경고**: `scripts/hooks/claude-posttooluse-prettier-warn.sh`
  차단하지 않는다. 위반이 보고되면 다음 편집에서 자가 교정한다.
EOF
CLAUDE_MD_SECTIONS+=("$_prettier_section")
unset _prettier_section
