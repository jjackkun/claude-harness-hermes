#  presets/global/mods.conf
# 패널 모드 프리셋(전역 선택) — Claude Code 안에 패널을 더하는 모드 세 개를 ~/.claude/skills/ 에 깐다.
# 스킬(SKILL.md)이 아니라 모드(플러그인 폴더)다. 엔진이 skills/ 아래의 플러그인 폴더를 자동으로 읽으므로
# 설치 경로는 스킬과 같다.
#
#   file-explorer       : 파일 트리, 문법 색, 편집·저장, git 탭 (/files, 띠의 [ 파일 ])
#   tool-calls-pane     : 이번 세션의 도구 호출 목록 (/tool-calls, 띠의 [ 도구 호출 ])
#   hermes-roster-pane  : 헤르메스 에이전트 명부 (/roster). 명부가 읽히는 프로젝트에서만 띠에 버튼이 뜬다.
#
# 고른 사람에게만 깔린다. 깔면 프롬프트 위에 여는 버튼이 생긴다.
#   켜기: public-claude.sh --skills-only --set-global "mods"
#   끄기: public-claude.sh --skills-only --set-global ""
# 한 번 켜면 update-all.sh 를 돌려도 유지된다(presets.global.lock).
#
# 요구: Claude Code 2.1.290 이상. 모드는 엔진 문서에 "EARLY ACCESS"로 적힌 기능이라 버전이 오르면 깨질 수 있다.
# 낮은 버전에서는 폴더만 깔리고 동작하지 않는다.
# 세 모드는 함께 깐다: [ 전체 닫기 ] 가 세 패널의 이름을 알고 있다.
# 설계: docs/design-docs/claude-code-mods.md · 계획: docs/exec-plans/ 의 mods-factory-install
#
# 반드시 += 로 쓴다. _common.conf 뒤에 읽히므로 = 로 쓰면 전역 기본 스킬이 목록에서 빠져 지워진다.

SKILLS+=(
  file-explorer
  tool-calls-pane
  hermes-roster-pane
)
